# Publish to PyPi package index
# Note: Requires a secret named PYPI_API_TOKEN to be set in the repository settings

name: PIP Publish

on:
  release:
    types: [published]

jobs:

  publish:
    name: Publish to PyPi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python Dependencies
        run: uv sync --locked
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The static bundles are gitignored, so they must be built here:
      # a wheel published without them has no plugin UI.
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run translate
          npm run build
      - name: Build Binary
        run: uv run python -m build
      - name: Publish
        run: uv run python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
          TWINE_REPOSITORY: pypi
