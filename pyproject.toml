#This file is used to package the BatchCodePlugin plugin.
#
#- It was generated by the InvenTree Plugin Creator tool - version 1.20.0
#- Ref: https://github.com/inventree/plugin_creator

[build-system]
requires = ["setuptools", "twine", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-batchcode-plugin"
description = "Generate progressive batch codes for StockItems, with a configurable format and persistent per-part / per-location counters."
dynamic = ["version"]
authors = [
    { name = "Simone Amadori",email = "simone@amadori.bs.it" },
]
readme = "README.md"
license = "MIT"
keywords = ["inventree", "plugin"]
# Matches the Python requirement of InvenTree 1.x
requires-python = ">=3.9"
dependencies = [
    # Everything this plugin imports (Django, DRF, InvenTree itself) is
    # provided by the InvenTree instance it is installed into.
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: InvenTree",
]

# Tooling only - the plugin has no runtime dependencies of its own.
# Installed into .venv by `uv sync`.
[dependency-groups]
dev = [
    "ruff>=0.12",
    "pre-commit>=4.0",
    "build>=1.2",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/Kamaar/inventree-batchcode-plugin"

[project.entry-points."inventree_plugins"]
BatchCodePlugin = "batchcode_plugin.core:BatchCodePlugin"

[tool.setuptools.packages.find]
include = ["batchcode_plugin*"]

[tool.setuptools.dynamic]
version = {attr = "batchcode_plugin.PLUGIN_VERSION"}

[tool.ruff]
exclude = [
    ".git",
    "__pycache__",
    "test.py",
    "build",
    "dist",
    "node_modules",
    "tests",
    "venv",
    "env",
    ".venv",
    ".env",
]

src = ["batchcode_plugin"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "UP", "B", "DJ"]
ignore = [
    # Line length is handled by the formatter
    "E501",
    # Django model __str__ is defined; the checker misses the classmethods
    "DJ012",
]

[tool.ruff.lint.per-file-ignores]
# Generated migrations are not documented
"batchcode_plugin/migrations/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
